version: "3.8"

services:
  ida-vnc:
    image: ida-vnc:9.4
    container_name: ida-vnc
    hostname: ida-vnc
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8443}:6901"
      - "${MCP_PORT:-8745}:8745"

    environment:
      - VNC_PW=${VNC_PASSWORD:-changeme}
      - HOME=/home/kasm-user

    volumes:
      # 工作目录
      - ./workspace:/home/kasm-user/workspace
      # 许可证文件（只读），直接放在 IDA 默认读取位置
      - ./ida.hexlic:/home/kasm-user/.idapro/ida.hexlic:ro
      # IDA 用户配置持久化（插件、主题等）
      - ida-config:/home/kasm-user/.idapro

volumes:
  ida-config:
